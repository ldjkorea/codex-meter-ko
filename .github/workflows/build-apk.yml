name: Verify Korean Android source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDKs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Verify wrapper integrity
        shell: bash
        run: sha256sum -c android/gradle/wrapper/SHA256SUMS.txt
      - name: Core and Korean regression tests
        shell: bash
        run: |
          bash android/run-tests.sh
          python3 android/tests/verify-localization.py
          python3 android/tests/verify-publication.py
      - name: Compile unsigned APKs and lint
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .local-signing
          bash gradlew :app:assembleRelease :wear:assembleRelease :app:lintRelease :wear:lintRelease --no-daemon --console=plain
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f wear/build/outputs/apk/release/wear-release-unsigned.apk
      # No signing secrets, artifacts, tags, or release publishing.
      # Patched dependencies and official Pretendard hashes are verified before compilation.
